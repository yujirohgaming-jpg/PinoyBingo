<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Bingo Night — Caller & Player App</title>
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --bg-elevated: #334155;
      --text-primary: #f8fafc;
      --text-muted: #94a3b8;
      --accent-gold: #f59e0b;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --border-subtle: rgba(255, 255, 255, 0.1);

      /* Classic Bingo Ball Colors */
      --ball-b: #2563eb;
      --ball-i: #dc2626;
      --ball-n: #16a34a;
      --ball-g: #d97706;
      --ball-o: #7c3aed;

      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Top Header & Mode Switcher */
    header.app-header {
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      border-bottom: 1px solid var(--border-subtle);
      padding: 12px 16px;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .header-top {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.25rem;
      letter-spacing: 0.5px;
    }

    .brand-badge {
      background: var(--accent-gold);
      color: #0f172a;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 900;
    }

    .mode-tabs {
      display: flex;
      background: var(--bg-main);
      padding: 4px;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
    }

    .mode-tab {
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 8px 18px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-tab.active {
      background: var(--accent-gold);
      color: #0f172a;
      box-shadow: 0 2px 8px rgba(245, 158, 11, 0.4);
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s;
    }

    .icon-btn:active {
      transform: scale(0.97);
    }

    .icon-btn.muted {
      opacity: 0.55;
    }

    /* Main Container */
    main.app-container {
      flex: 1;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px;
    }

    .view-section {
      display: none;
      animation: fadeIn 0.25s ease;
    }

    .view-section.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Pattern Banner Bar */
    .pattern-bar {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .pattern-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .mini-pattern-grid {
      display: grid;
      grid-template-columns: repeat(5, 7px);
      grid-template-rows: repeat(5, 7px);
      gap: 2px;
      background: #0f172a;
      padding: 4px;
      border-radius: 5px;
    }

    .mini-cell {
      width: 7px;
      height: 7px;
      background: #334155;
      border-radius: 1px;
    }

    .mini-cell.on {
      background: var(--accent-gold);
    }

    .pattern-text strong {
      display: block;
      font-size: 0.95rem;
      color: var(--accent-gold);
    }

    .pattern-text span {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* Reusable Buttons */
    .btn {
      border: none;
      border-radius: var(--radius-md);
      padding: 12px 18px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.1s, opacity 0.15s;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #0f172a;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.35);
    }

    .btn-success {
      background: var(--accent-green);
      color: #052e16;
    }

    .btn-secondary {
      background: var(--bg-elevated);
      color: var(--text-primary);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.18);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.35);
    }

    .btn-sm {
      padding: 7px 12px;
      font-size: 0.82rem;
      border-radius: var(--radius-sm);
    }

    /* Ball Colors Utility */
    .ball-B { background: radial-gradient(circle at 30% 30%, #60a5fa, var(--ball-b)); }
    .ball-I { background: radial-gradient(circle at 30% 30%, #f87171, var(--ball-i)); }
    .ball-N { background: radial-gradient(circle at 30% 30%, #4ade80, var(--ball-n)); }
    .ball-G { background: radial-gradient(circle at 30% 30%, #fbbf24, var(--ball-g)); }
    .ball-O { background: radial-gradient(circle at 30% 30%, #a78bfa, var(--ball-o)); }
    /* ================= LIVE CASINO / BINGO HALL FLASHBOARD THEME ================= */
    body {
      background:
        radial-gradient(circle at 50% 0%, #1e293b 0%, #090d16 65%, #05070c 100%) !important;
    }

    /* Enhanced Live Pattern Preview Grid */
    .mini-pattern-grid {
      grid-template-columns: repeat(5, 11px) !important;
      grid-template-rows: repeat(5, 11px) !important;
      gap: 3px !important;
      padding: 6px !important;
      border-radius: 8px !important;
      background: #050811 !important;
      border: 1px solid rgba(251, 191, 36, 0.45) !important;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.85);
      flex-shrink: 0;
    }

    .mini-cell {
      width: 11px !important;
      height: 11px !important;
      border-radius: 2px !important;
      background: #1e293b !important;
      transition: background-color 0.16s ease, transform 0.16s ease, box-shadow 0.16s ease;
    }

    .mini-cell.on {
      background: radial-gradient(circle at 35% 35%, #fef08a, #f59e0b) !important;
      box-shadow: 0 0 8px rgba(251, 191, 36, 0.95), 0 0 14px rgba(245, 158, 11, 0.55) !important;
      transform: scale(1.08);
    }

    /* Full-Screen Widescreen Container (Scales to 65" & 75" TVs) */
    main.app-container {
      max-width: 100% !important;
      padding: 12px 18px !important;
    }

    .caller-grid {
      grid-template-columns: 265px 1fr !important;
      gap: 18px !important;
      align-items: stretch !important;
    }

    @media (max-width: 820px) and (orientation: portrait) {
      .caller-grid {
        grid-template-columns: 1fr !important;
      }
    }

    @media (orientation: landscape) {
      .caller-grid {
        grid-template-columns: 250px 1fr !important;
        gap: 16px !important;
      }

      .master-board .board-row {
        grid-template-columns: 48px repeat(15, 1fr) !important;
        gap: 6px !important;
        margin-bottom: 7px !important;
      }
    }

    /* Realistic 3D Acrylic Bingo Balls */
    .ball-B {
      background: radial-gradient(circle at 28% 24%, #93c5fd 0%, #2563eb 42%, #1e3a8a 100%) !important;
    }
    .ball-I {
      background: radial-gradient(circle at 28% 24%, #fca5a5 0%, #dc2626 42%, #7f1d1d 100%) !important;
    }
    .ball-N {
      background: radial-gradient(circle at 28% 24%, #86efac 0%, #16a34a 42%, #14532d 100%) !important;
    }
    .ball-G {
      background: radial-gradient(circle at 28% 24%, #fde047 0%, #d97706 42%, #78350f 100%) !important;
    }
    .ball-O {
      background: radial-gradient(circle at 28% 24%, #d8b4fe 0%, #7c3aed 42%, #4c1d95 100%) !important;
    }

    .caller-stage {
      background: linear-gradient(180deg, #162033 0%, #0b111e 100%) !important;
      border: 1px solid rgba(251, 191, 36, 0.25) !important;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.08) !important;
      padding: 14px !important;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .current-ball {
      width: 132px !important;
      height: 132px !important;
      margin: 4px auto 10px !important;
      aspect-ratio: 1 / 1;
      position: relative;
      border: 3px solid rgba(255, 255, 255, 0.35) !important;
      box-shadow:
        0 18px 32px rgba(0, 0, 0, 0.75),
        inset -6px -10px 18px rgba(0, 0, 0, 0.55),
        inset 4px 6px 12px rgba(255, 255, 255, 0.45) !important;
    }

    /* Glossy Studio Reflection on Top-Left of Drawn Ball */
    .current-ball::before {
      content: "";
      position: absolute;
      top: 10px;
      left: 20px;
      width: 36px;
      height: 18px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.75) 0%, rgba(255, 255, 255, 0) 75%);
      transform: rotate(-28deg);
      pointer-events: none;
    }

    .ball-inner-circle {
      width: 86px !important;
      height: 86px !important;
      aspect-ratio: 1 / 1;
      background: radial-gradient(circle at 35% 30%, #ffffff 0%, #f1f5f9 75%, #cbd5e1 100%) !important;
      border: 2px solid rgba(15, 23, 42, 0.18);
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.25), 0 2px 6px rgba(0, 0, 0, 0.35) !important;
    }

    .ball-letter {
      font-size: 1.25rem !important;
      color: #334155 !important;
    }

    .ball-number {
      font-size: 2.45rem !important;
      color: #090d16 !important;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.8);
    }

    .mini-ball {
      box-shadow:
        0 5px 10px rgba(0, 0, 0, 0.55),
        inset -2px -3px 6px rgba(0, 0, 0, 0.45),
        inset 2px 2px 5px rgba(255, 255, 255, 0.4) !important;
    }

    /* Subtle / De-emphasized Controls so Board & Ball Dominate */
    .caller-controls {
      gap: 7px !important;
      opacity: 0.85;
      transition: opacity 0.2s ease;
    }

    .caller-controls:hover,
    .caller-controls:focus-within {
      opacity: 1;
    }

    .caller-controls .btn-primary {
      padding: 10px 14px !important;
      font-size: 0.92rem !important;
    }

    .caller-controls .btn-secondary,
    .caller-controls .btn-danger,
    .auto-call-row select {
      padding: 7px 10px !important;
      font-size: 0.78rem !important;
      background: rgba(9, 13, 22, 0.65) !important;
      border: 1px solid rgba(255, 255, 255, 0.08) !important;
      color: var(--text-muted) !important;
    }

    .caller-controls .btn-success {
      padding: 7px 10px !important;
      font-size: 0.78rem !important;
    }

    /* Authentic Casino LED Master Flashboard */
    .master-board {
      background: linear-gradient(180deg, #0b101b 0%, #060911 100%) !important;
      border: 2px solid rgba(245, 158, 11, 0.35) !important;
      box-shadow:
        0 20px 45px rgba(0, 0, 0, 0.8),
        inset 0 0 25px rgba(0, 0, 0, 0.9) !important;
      padding: 16px 18px !important;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .master-board .board-header h2 {
      color: #fbbf24;
      letter-spacing: 1.5px;
      text-shadow: 0 0 12px rgba(251, 191, 36, 0.4);
    }

    .master-board .board-row {
      grid-template-columns: 50px repeat(15, 1fr) !important;
      gap: 6px !important;
      margin-bottom: 8px !important;
    }

    @media (max-width: 640px) and (orientation: portrait) {
      .master-board .board-row {
        grid-template-columns: 32px repeat(8, 1fr) !important;
        gap: 4px !important;
        margin-bottom: 5px !important;
      }
    }

    .master-board .board-letter-tag {
      height: clamp(40px, 6.8vh, 84px) !important;
      font-size: clamp(1.15rem, 2.5vh, 2rem) !important;
      border-radius: 9px !important;
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.35), 0 4px 10px rgba(0, 0, 0, 0.5);
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
    }

    /* Recessed Dark LED Number Windows */
    .master-board .board-cell {
      height: clamp(40px, 6.8vh, 84px) !important;
      font-size: clamp(0.95rem, 2.3vh, 1.85rem) !important;
      border-radius: 8px !important;
      background: linear-gradient(180deg, #0d1424 0%, #090e1a 100%) !important;
      border: 1px solid rgba(255, 255, 255, 0.06) !important;
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.85) !important;
      color: #334155 !important;
      font-variant-numeric: tabular-nums;
      transition: all 0.22s ease !important;
    }

    /* Illuminated Amber Casino Bulbs */
    .master-board .board-cell.called {
      background: radial-gradient(circle at 50% 35%, #fef08a 0%, #f59e0b 65%, #b45309 100%) !important;
      color: #1c1002 !important;
      font-weight: 900 !important;
      border: 1px solid #fde68a !important;
      box-shadow:
        0 0 14px rgba(245, 158, 11, 0.65),
        inset 0 2px 4px rgba(255, 255, 255, 0.65) !important;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.45);
    }

    /* Active Spotlight Emerald Pulse for the Latest Ball */
    .master-board .board-cell.latest {
      background: radial-gradient(circle at 50% 35%, #a7f3d0 0%, #10b981 65%, #047857 100%) !important;
      color: #022c22 !important;
      font-weight: 900 !important;
      border: 2px solid #ecfdf5 !important;
      box-shadow:
        0 0 22px rgba(16, 185, 129, 0.95),
        0 0 36px rgba(16, 185, 129, 0.45),
        inset 0 2px 5px rgba(255, 255, 255, 0.8) !important;
      transform: scale(1.06) !important;
      z-index: 2;
    }

    /* TV Broadcast Mode */
    body.tv-mode header.app-header {
      display: none !important;
    }

    body.tv-mode .pattern-bar {
      padding: 6px 14px !important;
      margin-bottom: 8px !important;
      background: rgba(15, 23, 42, 0.85) !important;
      border: 1px solid rgba(251, 191, 36, 0.25) !important;
    }

    body.tv-mode .pattern-bar .btn {
      opacity: 0.4;
      padding: 5px 10px !important;
      font-size: 0.75rem !important;
    }

    body.tv-mode .pattern-bar .btn:hover {
      opacity: 1;
    }

    body.tv-mode main.app-container {
      padding: 8px 14px !important;
      max-width: 100% !important;
    }

    body.tv-mode .master-board .board-letter-tag,
    body.tv-mode .master-board .board-cell {
      height: clamp(44px, 11.5vh, 110px) !important;
      font-size: clamp(1.1rem, 3.2vh, 2.4rem) !important;
    }

    .tv-exit-pill {
      display: none;
      position: fixed;
      bottom: 8px;
      right: 12px;
      z-index: 80;
      background: rgba(9, 13, 22, 0.8);
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }

    body.tv-mode .tv-exit-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    /* Caller View */
    .caller-grid {
      display: grid;
      grid-template-columns: 310px 1fr;
      gap: 16px;
      align-items: start;
    }

    @media (max-width: 820px) {
      .caller-grid { grid-template-columns: 1fr; }
    }

    .caller-stage, .master-board {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 18px;
      box-shadow: var(--shadow-lg);
    }

    .caller-stage { text-align: center; }

    .current-ball {
      width: 136px;
      height: 136px;
      margin: 8px auto 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #475569, #1e293b);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      border: 4px solid rgba(255, 255, 255, 0.25);
    }

    .current-ball.pop {
      animation: ballPop 0.32s ease-out;
    }

    @keyframes ballPop {
      0% { transform: scale(0.7); }
      70% { transform: scale(1.07); }
      100% { transform: scale(1); }
    }

    .ball-inner-circle {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      background: #ffffff;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .ball-letter { font-size: 1.3rem; font-weight: 900; line-height: 1; }
    .ball-number { font-size: 2.6rem; font-weight: 900; line-height: 1; margin-top: 2px; }
    .call-stats { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px; }

    .caller-controls { display: flex; flex-direction: column; gap: 10px; }
    .auto-call-row { display: flex; gap: 8px; }
    .auto-call-row select {
      background: var(--bg-main);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 10px;
      font-weight: 600;
    }

    .recent-balls-box {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border-subtle);
    }

    .recent-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .recent-list { display: flex; justify-content: center; gap: 8px; min-height: 40px; }

    .mini-ball {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.72rem;
      color: #fff;
      border: 2px solid rgba(255, 255, 255, 0.3);
    }

    /* Master Board */
    .board-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .board-row {
      display: grid;
      grid-template-columns: 36px repeat(15, 1fr);
      gap: 4px;
      margin-bottom: 6px;
    }

    @media (max-width: 640px) {
      .board-row { grid-template-columns: 30px repeat(8, 1fr); }
      .board-letter-tag { grid-row: span 2; height: 100% !important; }
    }

    .board-letter-tag {
      height: 32px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #fff;
    }

    .board-cell {
      height: 32px;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 700;
      color: #475569;
    }

    .board-cell.called {
      background: var(--accent-gold);
      color: #0f172a;
      box-shadow: 0 0 8px rgba(245, 158, 11, 0.45);
    }

    .board-cell.latest {
      background: var(--accent-green);
      color: #052e16;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.7);
    }

    /* Player View */
    .player-toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      background: var(--bg-card);
      padding: 12px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
    }

    .card-count-group { display: flex; align-items: center; gap: 6px; }
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }

    .bingo-card {
      background: #ffffff;
      color: #0f172a;
      border-radius: var(--radius-lg);
      padding: 12px;
      box-shadow: var(--shadow-lg);
      border: 3px solid #cbd5e1;
    }

    .bingo-card.winner {
      border-color: var(--accent-gold);
      box-shadow: 0 0 24px rgba(245, 158, 11, 0.65);
    }

    .card-top-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.78rem;
      font-weight: 800;
      color: #64748b;
    }

    .card-headers, .card-cells {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
    }

    .card-headers { margin-bottom: 6px; }

    .card-col-head {
      text-align: center;
      font-weight: 900;
      font-size: 1.2rem;
      color: #fff;
      padding: 5px 0;
      border-radius: 8px;
    }

    .card-cell {
      aspect-ratio: 1 / 1;
      background: #f1f5f9;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: 800;
      cursor: pointer;
      position: relative;
      user-select: none;
    }

    .card-cell.daubed {
      background: #fee2e2;
      border-color: #ef4444;
      color: #991b1b;
    }

    .card-cell.daubed::after {
      content: "";
      position: absolute;
      width: 76%;
      height: 76%;
      border-radius: 50%;
      background: rgba(239, 68, 68, 0.28);
      border: 3px solid rgba(220, 38, 38, 0.7);
    }

    .card-cell.free-space {
      background: #fef3c7;
      border-color: #f59e0b;
      color: #b45309;
      font-size: 0.75rem;
      font-weight: 900;
      text-align: center;
    }

    .card-cell.win-highlight {
      background: #fef08a !important;
      border-color: #eab308 !important;
    }

    /* Modals & Win Banner */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.82);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-backdrop.open { display: flex; }

    .modal-box {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 500px;
      max-height: 86vh;
      overflow-y: auto;
      padding: 18px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .pattern-options {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
      gap: 10px;
    }

    .pattern-option {
      background: var(--bg-main);
      border: 2px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 10px;
      text-align: center;
      cursor: pointer;
      color: var(--text-primary);
    }

    .pattern-option.selected {
      border-color: var(--accent-gold);
      background: rgba(245, 158, 11, 0.14);
    }

    .pattern-option .mini-pattern-grid { margin: 0 auto 8px; width: fit-content; }

    .bingo-banner {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(150%);
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: #fff;
      padding: 12px 22px;
      border-radius: 999px;
      font-weight: 900;
      font-size: 1.1rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.55);
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 90;
      transition: transform 0.3s ease;
    }

    .bingo-banner.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-top">
      <div class="brand">
        <span class="brand-badge">75-BALL</span>
        <span>BINGO NIGHT</span>
      </div>

      <div class="mode-tabs" role="tablist">
        <button class="mode-tab active" id="tabCaller" onclick="switchMode('caller')">Caller Board</button>
        <button class="mode-tab" id="tabPlayer" onclick="switchMode('player')">Player Cards</button>
      </div>

      <div class="header-actions">
        <button class="icon-btn" onclick="document.body.classList.toggle('tv-mode')" title="Full-Screen TV / AirPlay Layout">
          <span>📺</span> <span>TV View</span>
        </button>
        <button class="icon-btn" id="btnSound" onclick="toggleSound()" title="Toggle Voice & Sound">
          <span id="soundIcon">🔊</span> <span id="soundLabel">Voice On</span>
        </button>
      </div>
    </div>
  </header>

  <button class="tv-exit-pill" onclick="document.body.classList.remove('tv-mode')">
    ✕ Exit TV View
  </button>

  <main class="app-container">
    <div class="pattern-bar">
      <div class="pattern-info">
        <div class="mini-pattern-grid" id="activePatternMini"></div>
        <div class="pattern-text">
          <strong id="activePatternName">Standard Line</strong>
          <span id="activePatternDesc">Any horizontal, vertical, or diagonal line</span>
        </div>
      </div>
      <button class="btn btn-secondary btn-sm" onclick="openPatternModal()">Change Pattern</button>
    </div>

    <section class="view-section active" id="viewCaller">
      <div class="caller-grid">
        <div class="caller-stage">
          <div>
            <div class="recent-label">Current Call</div>
            <div class="current-ball" id="currentBall">
              <div class="ball-inner-circle">
                <div class="ball-letter" id="ballLetter">—</div>
                <div class="ball-number" id="ballNumber">READY</div>
              </div>
            </div>
            <div class="call-stats" id="callStats">0 of 75 pattern balls called</div>
          </div>

          <div class="caller-controls">
            <button class="btn btn-primary" id="btnDrawBall" onclick="drawNextBall()">
              🎱 Draw Next Ball
            </button>

            <div class="auto-call-row">
              <button class="btn btn-secondary" style="flex:1;" id="btnAutoCall" onclick="toggleAutoCall()">
                ▶ Auto-Call
              </button>
              <select id="autoCallInterval" onchange="updateAutoInterval()">
                <option value="5">5 sec</option>
                <option value="8" selected>8 sec</option>
                <option value="12">12 sec</option>
                <option value="15">15 sec</option>
              </select>
            </div>

            <button class="btn btn-danger btn-sm" onclick="confirmNewGame()">
              ↻ Reset Round
            </button>
          </div>

          <div class="recent-balls-box">
            <div class="recent-label">Last 5 Calls</div>
            <div class="recent-list" id="recentBallsList"></div>
          </div>
        </div>

        <div class="master-board">
          <div class="board-header">
            <h2>MASTER BOARD (1–75)</h2>
            <span style="font-size:0.85rem; color:var(--text-muted);" id="remainingStats">75 Remaining</span>
          </div>
          <div id="masterBoardGrid"></div>
        </div>
      </div>
    </section>

    <section class="view-section" id="viewPlayer">
      <div class="player-toolbar">
        <div class="card-count-group">
          <span style="font-size:0.85rem; font-weight:700; color:var(--text-muted);">Cards:</span>
          <button class="btn btn-secondary btn-sm" id="cntBtn1" onclick="setCardCount(1)">1</button>
          <button class="btn btn-secondary btn-sm" id="cntBtn2" onclick="setCardCount(2)">2</button>
          <button class="btn btn-secondary btn-sm" id="cntBtn3" onclick="setCardCount(3)">3</button>
          <button class="btn btn-secondary btn-sm" id="cntBtn4" onclick="setCardCount(4)">4</button>
        </div>

        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button class="btn btn-secondary btn-sm" onclick="clearCardDaubs()">Clear Daubs</button>
          <button class="btn btn-primary btn-sm" onclick="generateNewPlayerCards(true)">New Cards</button>
        </div>
      </div>

      <div class="cards-grid" id="playerCardsGrid"></div>
    </section>
  </main>

  <div class="modal-backdrop" id="patternModal" onclick="if(event.target===this) closePatternModal()">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Select Winning Pattern</h3>
        <button class="btn btn-secondary btn-sm" onclick="closePatternModal()">✕</button>
      </div>
      <div class="pattern-options" id="patternOptionsGrid"></div>
    </div>
  </div>

  <div class="bingo-banner" id="bingoBanner">
    <span>🎉 BINGO! Winning Pattern Matched!</span>
    <button class="btn btn-sm" style="background:#fff; color:#0f172a;" onclick="hideBingoBanner()">OK</button>
  </div>
  <script>
    const STORAGE_KEY = "bingo_night_v4_state";

    const LETTERS = [
      { letter: "B", min: 1, max: 15 },
      { letter: "I", min: 16, max: 30 },
      { letter: "N", min: 31, max: 45 },
      { letter: "G", min: 46, max: 60 },
      { letter: "O", min: 61, max: 75 }
    ];

    function getActiveColsFromMasks(masks) {
      const colNames = ["B", "I", "N", "G", "O"];
      const activeSet = new Set();
      masks.forEach((mask) => {
        mask.forEach((cellIdx) => activeSet.add(colNames.at(cellIdx % 5)));
      });
      return colNames.filter((c) => activeSet.has(c));
    }

    function buildPatterns() {
      const idx = (r, c) => r * 5 + c;
      const rows = Array.from({ length: 5 }, (_, r) => Array.from({ length: 5 }, (_, c) => idx(r, c)));
      const cols = Array.from({ length: 5 }, (_, c) => Array.from({ length: 5 }, (_, r) => idx(r, c)));
      const diag1 = Array.from({ length: 5 }, (_, i) => idx(i, i));
      const diag2 = Array.from({ length: 5 }, (_, i) => idx(i, 4 - i));
      const allLines = [...rows, ...cols, diag1, diag2];

      const twoLineMasks = [];
      for (let i = 0; i < allLines.length; i++) {
        for (let j = i + 1; j < allLines.length; j++) {
          twoLineMasks.push(Array.from(new Set([...allLines.at(i), ...allLines.at(j)])));
        }
      }

      const corners = [idx(0, 0), idx(0, 4), idx(4, 0), idx(4, 4)];
      const smallDiamond = [idx(1, 2), idx(2, 1), idx(2, 3), idx(3, 2)];
      const largeDiamond = [idx(0, 2), idx(1, 1), idx(1, 3), idx(2, 0), idx(2, 4), idx(3, 1), idx(3, 3), idx(4, 2)];
      const letterT = Array.from(new Set([...rows.at(0), ...cols.at(2)]));
      const plusSign = Array.from(new Set([...rows.at(2), ...cols.at(2)]));
      const letterL = Array.from(new Set([...cols.at(0), ...rows.at(4)]));
      const letterH = Array.from(new Set([...cols.at(0), ...cols.at(4), ...rows.at(2)]));
      const letterU = Array.from(new Set([...cols.at(0), ...cols.at(4), ...rows.at(4)]));
      const railroad = Array.from(new Set([...cols.at(1), ...cols.at(3)]));
      const innerSquare = [idx(1, 1), idx(1, 2), idx(1, 3), idx(2, 1), idx(2, 2), idx(2, 3), idx(3, 1), idx(3, 2), idx(3, 3)];
      const frame = Array.from(new Set([...rows.at(0), ...rows.at(4), ...cols.at(0), ...cols.at(4)]));
      const stamps = [
        [idx(0, 0), idx(0, 1), idx(1, 0), idx(1, 1)],
        [idx(0, 3), idx(0, 4), idx(1, 3), idx(1, 4)],
        [idx(3, 0), idx(3, 1), idx(4, 0), idx(4, 1)],
        [idx(3, 3), idx(3, 4), idx(4, 3), idx(4, 4)]
      ];

      const sixPacks = [];
      for (let r = 0; r <= 3; r++) {
        for (let c = 0; c <= 2; c++) {
          sixPacks.push([idx(r, c), idx(r, c + 1), idx(r, c + 2), idx(r + 1, c), idx(r + 1, c + 1), idx(r + 1, c + 2)]);
        }
      }
      for (let r = 0; r <= 2; r++) {
        for (let c = 0; c <= 3; c++) {
          sixPacks.push([idx(r, c), idx(r, c + 1), idx(r + 1, c), idx(r + 1, c + 1), idx(r + 2, c), idx(r + 2, c + 1)]);
        }
      }

      const all25 = Array.from({ length: 25 }, (_, i) => i);
      const toGrid = (list) => all25.map((i) => (list.includes(i) ? 1 : 0));

      return [
        { id: "line", name: "Standard Line", desc: "Any horizontal, vertical, or diagonal line", activeCols: ["B", "I", "N", "G", "O"], preview: toGrid(rows.at(2)), masks: allLines },
        { id: "two_lines", name: "Two Lines", desc: "Any two complete lines on the same card", activeCols: ["B", "I", "N", "G", "O"], preview: toGrid([...rows.at(1), ...rows.at(3)]), masks: twoLineMasks },
        { id: "corners", name: "Four Corners", desc: "All 4 outer corner squares (B & O balls only)", activeCols: ["B", "O"], preview: toGrid(corners), masks: [corners] },
        { id: "postage", name: "Postage Stamp", desc: "Any 2x2 block in one of the 4 corners (B, I, G, O only)", activeCols: ["B", "I", "G", "O"], preview: toGrid(stamps.at(0)), masks: stamps },
        { id: "six_pack", name: "Six-Pack (2x3)", desc: "Any 6-square rectangle block (2x3 or 3x2)", activeCols: ["B", "I", "N", "G", "O"], preview: toGrid(sixPacks.at(0)), masks: sixPacks },
        { id: "center_col", name: "Center Column (N)", desc: "All 5 squares down the middle N column (N balls only)", activeCols: ["N"], preview: toGrid(cols.at(2)), masks: [cols.at(2)] },
        { id: "railroad", name: "Railroad Tracks", desc: "Full I and G columns (I & G balls only)", activeCols: ["I", "G"], preview: toGrid(railroad), masks: [railroad] },
        { id: "inner_square", name: "Inner 3x3 Box", desc: "Middle 9 squares around FREE space (I, N, G only)", activeCols: ["I", "N", "G"], preview: toGrid(innerSquare), masks: [innerSquare] },
        { id: "small_diamond", name: "Small Diamond", desc: "4 squares directly surrounding FREE space (I, N, G only)", activeCols: ["I", "N", "G"], preview: toGrid(smallDiamond), masks: [smallDiamond] },
        { id: "large_diamond", name: "Large Diamond", desc: "Outer diamond shape touching all 4 edges", activeCols: ["B", "I", "N", "G", "O"], preview: toGrid(largeDiamond), masks: [largeDiamond] },
        { id: "x_pattern", name: "Big X", desc: "Both diagonal lines crossing the center", activeCols: ["B", "I", "N", "G", "O"], preview: toGrid([...diag1, ...diag2]), masks: [Array.from(new Set([...diag1, ...diag2]))] },
        { id: "letter_t", name: "Letter T", desc: "Top row plus middle column", activeCols: ["B", "I", "N", "G", "O"], preview: toGrid(letterT), masks: [letterT] },
        { id: "letter_l", name: "Letter L", desc: "Left B column plus bottom row", activeCols: ["B", "I", "N", "G", "O"], preview: toGrid(letterL), masks: [letterL] },
        { id: "letter_h", name: "Letter H", desc: "Outer B & O columns plus middle row", activeCols: ["B", "I", "N", "G", "O"], preview: toGrid(letterH), masks: [letterH] },
        { id: "letter_u", name: "Letter U", desc: "Outer B & O columns plus bottom row", activeCols: ["B", "I", "N", "G", "O"], preview: toGrid(letterU), masks: [letterU] },
        { id: "plus", name: "Plus Sign (+)", desc: "Middle row and middle column", activeCols: ["B", "I", "N", "G", "O"], preview: toGrid(plusSign), masks: [plusSign] },
        { id: "frame", name: "Picture Frame", desc: "All 16 outer border squares", activeCols: ["B", "I", "N", "G", "O"], preview: toGrid(frame), masks: [frame] },
        { id: "blackout", name: "Blackout / Coverall", desc: "Every single square on the entire card", activeCols: ["B", "I", "N", "G", "O"], preview: toGrid(all25), masks: [all25] }
      ];
    }
    const PRESET_PATTERNS = buildPatterns();

    let appState = {
      mode: "caller",
      soundEnabled: true,
      patternId: "line",
      patternOnlyCalls: true,
      customPatterns: [],
      calledNumbers: [],
      cardCount: 1,
      cards: []
    };

    function getAllPatterns() {
      return [...PRESET_PATTERNS, ...(appState.customPatterns || [])];
    }

    let autoCallTimer = null;
    let audioCtx = null;

    function saveState() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(appState)); } catch (e) {}
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) appState = { ...appState, ...JSON.parse(raw) };
      } catch (e) {}
    }

    function getLetterForNumber(num) {
      if (num <= 15) return "B";
      if (num <= 30) return "I";
      if (num <= 45) return "N";
      if (num <= 60) return "G";
      return "O";
    }

    function playChime(isWin = false) {
      if (!appState.soundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
        const now = audioCtx.currentTime;
        const notes = isWin ? [523.25, 659.25, 783.99, 1046.5] : [587.33, 880];
        notes.forEach((freq, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = isWin ? "triangle" : "sine";
          osc.frequency.setValueAtTime(freq, now + i * 0.11);
          gain.gain.setValueAtTime(0.18, now + i * 0.11);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.11 + 0.35);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + i * 0.11);
          osc.stop(now + i * 0.11 + 0.36);
        });
      } catch (e) {}
    }

    function speakCall(letter, num) {
      if (!appState.soundEnabled || !("speechSynthesis" in window)) return;
      try {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(`${letter}, ${num}`);
        utter.rate = 0.95;
        utter.pitch = 1.05;
        window.speechSynthesis.speak(utter);
      } catch (e) {}
    }
    /* ================= LIVE PATTERN ANIMATION & PICKER ================= */
    let activeBannerAnimTimer = null;
    let modalAnimTimers = [];
    let customBuilderDraft = new Set();
    let customBuilderAllowSlide = true;

    function getActivePattern() {
      const all = getAllPatterns();
      return all.find((p) => p.id === appState.patternId) || all.at(0);
    }

    function getPatternAnimationFrames(pat) {
      const idx = (r, c) => r * 5 + c;

      if (pat.id === "line") {
        const frames = [];
        for (let r = 0; r < 5; r++) {
          frames.push([idx(r, 0), idx(r, 1), idx(r, 2), idx(r, 3), idx(r, 4)]);
        }
        for (let c = 0; c < 5; c++) {
          frames.push([idx(0, c), idx(1, c), idx(2, c), idx(3, c), idx(4, c)]);
        }
        frames.push([idx(0, 0), idx(1, 1), idx(2, 2), idx(3, 3), idx(4, 4)]);
        frames.push([idx(0, 4), idx(1, 3), idx(2, 2), idx(3, 1), idx(4, 0)]);
        return frames;
      }

      if (pat.id === "two_lines") {
        return [
          [idx(0, 0), idx(0, 1), idx(0, 2), idx(0, 3), idx(0, 4), idx(4, 0), idx(4, 1), idx(4, 2), idx(4, 3), idx(4, 4)],
          [idx(0, 0), idx(1, 0), idx(2, 0), idx(3, 0), idx(4, 0), idx(0, 4), idx(1, 4), idx(2, 4), idx(3, 4), idx(4, 4)],
          [idx(1, 0), idx(1, 1), idx(1, 2), idx(1, 3), idx(1, 4), idx(0, 2), idx(1, 2), idx(2, 2), idx(3, 2), idx(4, 2)],
          [idx(0, 0), idx(1, 1), idx(2, 2), idx(3, 3), idx(4, 4), idx(4, 0), idx(4, 1), idx(4, 2), idx(4, 3), idx(4, 4)]
        ];
      }

      if (pat.id === "postage") {
        return [
          [idx(0, 0), idx(0, 1), idx(1, 0), idx(1, 1)],
          [idx(0, 3), idx(0, 4), idx(1, 3), idx(1, 4)],
          [idx(3, 3), idx(3, 4), idx(4, 3), idx(4, 4)],
          [idx(3, 0), idx(3, 1), idx(4, 0), idx(4, 1)]
        ];
      }

      if (pat.id === "six_pack") {
        return [
          [idx(0, 0), idx(0, 1), idx(0, 2), idx(1, 0), idx(1, 1), idx(1, 2)],
          [idx(0, 2), idx(0, 3), idx(0, 4), idx(1, 2), idx(1, 3), idx(1, 4)],
          [idx(3, 2), idx(3, 3), idx(3, 4), idx(4, 2), idx(4, 3), idx(4, 4)],
          [idx(3, 0), idx(3, 1), idx(3, 2), idx(4, 0), idx(4, 1), idx(4, 2)]
        ];
      }

      // If custom sliding pattern has multiple shifted masks, cycle through them live
      if (pat.isCustom && pat.masks && pat.masks.length > 1) {
        return pat.masks;
      }

      const staticIndices = [];
      pat.preview.forEach((val, i) => {
        if (val) staticIndices.push(i);
      });
      return [staticIndices];
    }

    function renderMiniGridFromIndices(containerEl, activeIndices) {
      if (!containerEl) return;
      const activeSet = new Set(activeIndices || []);
      let html = "";
      for (let i = 0; i < 25; i++) {
        html += `<div class="mini-cell${activeSet.has(i) ? " on" : ""}"></div>`;
      }
      containerEl.innerHTML = html;
    }

    function startLiveMiniAnimation(containerEl, pat, intervalMs = 420) {
      const frames = getPatternAnimationFrames(pat);
      renderMiniGridFromIndices(containerEl, frames.at(0));

      if (frames.length <= 1) return null;

      let step = 0;
      return setInterval(() => {
        step = (step + 1) % frames.length;
        renderMiniGridFromIndices(containerEl, frames.at(step));
      }, intervalMs);
    }

    function renderPatternBar() {
      const pat = getActivePattern();
      document.getElementById("activePatternName").textContent = pat.name;
      document.getElementById("activePatternDesc").textContent = pat.desc;

      if (activeBannerAnimTimer !== null) {
        clearInterval(activeBannerAnimTimer);
        activeBannerAnimTimer = null;
      }
      const miniEl = document.getElementById("activePatternMini");
      activeBannerAnimTimer = startLiveMiniAnimation(miniEl, pat, 420);
    }

    function clearModalAnimations() {
      modalAnimTimers.forEach((id) => clearInterval(id));
      modalAnimTimers = [];
    }

    function selectPatternAndClose(patternId) {
      appState.patternId = patternId;
      saveState();
      renderPatternBar();
      renderMasterBoard();
      renderPlayerCards();
      closePatternModal();
    }

    function deleteCustomPattern(event, patternId) {
      event.stopPropagation();
      if (!confirm("Delete this custom pattern?")) return;
      appState.customPatterns = (appState.customPatterns || []).filter((p) => p.id !== patternId);
      if (appState.patternId === patternId) appState.patternId = "line";
      saveState();
      renderPatternBar();
      renderMasterBoard();
      renderPlayerCards();
      openPatternModal();
    }

    function openPatternModal() {
      clearModalAnimations();
      const grid = document.getElementById("patternOptionsGrid");
      grid.innerHTML = "";

      const builderBar = document.createElement("div");
      builderBar.style.gridColumn = "1 / -1";
      builderBar.style.marginBottom = "4px";
      builderBar.innerHTML = `
        <button class="btn btn-primary btn-sm" style="width:100%;" onclick="openCustomPatternBuilder()">
          ✨ + Create Custom Pattern
        </button>
      `;
      grid.appendChild(builderBar);

      getAllPatterns().forEach((pat) => {
        const btn = document.createElement("div");
        btn.className = `pattern-option ${pat.id === appState.patternId ? "selected" : ""}`;
        btn.style.position = "relative";
        btn.onclick = () => selectPatternAndClose(pat.id);

        if (pat.isCustom) {
          const delBtn = document.createElement("button");
          delBtn.textContent = "✕";
          delBtn.title = "Delete Custom Pattern";
          delBtn.style.cssText =
            "position:absolute; top:6px; right:6px; background:rgba(239,68,68,0.25); color:#fca5a5; border:none; border-radius:4px; width:20px; height:20px; font-size:0.7rem; cursor:pointer;";
          delBtn.onclick = (e) => deleteCustomPattern(e, pat.id);
          btn.appendChild(delBtn);
        }

        const mini = document.createElement("div");
        mini.className = "mini-pattern-grid";
        const timerId = startLiveMiniAnimation(mini, pat, 420);
        if (timerId !== null) modalAnimTimers.push(timerId);

        const label = document.createElement("div");
        label.style.fontWeight = "700";
        label.style.fontSize = "0.85rem";
        label.textContent = pat.name;

        const sub = document.createElement("div");
        sub.style.fontSize = "0.7rem";
        sub.style.color = "var(--text-muted)";
        sub.style.marginTop = "3px";
        sub.textContent = pat.activeCols.length < 5 ? `Cols: ${pat.activeCols.join(", ")}` : "All Columns";

        btn.appendChild(mini);
        btn.appendChild(label);
        btn.appendChild(sub);
        grid.appendChild(btn);
      });

      document.getElementById("patternModal").classList.add("open");
    }
    /* ================= CUSTOM PATTERN DESIGNER (EXACT OR ANYWHERE) ================= */
    function generateShiftedMasks(selectedIndices, allowSlide) {
      if (!allowSlide || selectedIndices.length === 0) {
        return [selectedIndices];
      }

      const coords = selectedIndices.map((idx) => ({
        r: Math.floor(idx / 5),
        c: idx % 5
      }));

      const minR = Math.min(...coords.map((pt) => pt.r));
      const maxR = Math.max(...coords.map((pt) => pt.r));
      const minC = Math.min(...coords.map((pt) => pt.c));
      const maxC = Math.max(...coords.map((pt) => pt.c));

      const height = maxR - minR + 1;
      const width = maxC - minC + 1;
      const normalized = coords.map((pt) => ({ r: pt.r - minR, c: pt.c - minC }));

      const masks = [];
      for (let startR = 0; startR <= 5 - height; startR++) {
        for (let startC = 0; startC <= 5 - width; startC++) {
          const shifted = normalized
            .map((pt) => (startR + pt.r) * 5 + (startC + pt.c))
            .sort((a, b) => a - b);
          masks.push(shifted);
        }
      }
      return masks.length > 0 ? masks : [selectedIndices];
    }

    function openCustomPatternBuilder() {
      clearModalAnimations();
      customBuilderDraft = new Set();
      customBuilderAllowSlide = true;
      renderCustomPatternBuilder();
    }

    function toggleBuilderSquare(cellIdx) {
      if (customBuilderDraft.has(cellIdx)) customBuilderDraft.delete(cellIdx);
      else customBuilderDraft.add(cellIdx);
      renderCustomPatternBuilder(document.getElementById("customPatNameInput")?.value || "");
    }

    function setBuilderSlideMode(allowSlide) {
      customBuilderAllowSlide = allowSlide;
      renderCustomPatternBuilder(document.getElementById("customPatNameInput")?.value || "");
    }

    function renderCustomPatternBuilder(currentName = "") {
      const grid = document.getElementById("patternOptionsGrid");
      const selectedArr = Array.from(customBuilderDraft).sort((a, b) => a - b);
      const masks = selectedArr.length > 0 ? generateShiftedMasks(selectedArr, customBuilderAllowSlide) : [];
      const activeCols = masks.length > 0 ? getActiveColsFromMasks(masks) : [];

      let cellsHtml = "";
      for (let i = 0; i < 25; i++) {
        const isOn = customBuilderDraft.has(i);
        const isFree = i === 12;
        cellsHtml += `
          <div onclick="toggleBuilderSquare(${i})"
               style="aspect-ratio:1/1; border-radius:8px; display:flex; align-items:center; justify-content:center;
                      font-weight:800; font-size:0.75rem; cursor:pointer; user-select:none;
                      background:${isOn ? "#f59e0b" : "#0f172a"};
                      color:${isOn ? "#0f172a" : "#94a3b8"};
                      border:2px solid ${isOn ? "#fde68a" : "rgba(255,255,255,0.12)"};">
            ${isFree ? "FREE" : ""}
          </div>
        `;
      }

      grid.innerHTML = `
        <div style="grid-column: 1 / -1; display:flex; flex-direction:column; gap:11px;">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <strong style="color:var(--accent-gold);">Custom Pattern Designer</strong>
            <button class="btn btn-secondary btn-sm" onclick="openPatternModal()">← Back</button>
          </div>

          <input id="customPatNameInput" type="text" maxlength="26"
                 placeholder="Pattern Name (e.g. Any 2x2, Mini L)"
                 value="${currentName.replace(/"/g, "&quot;")}"
                 style="width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--border-subtle);
                        background:var(--bg-main); color:var(--text-primary); font-size:0.92rem; font-weight:600;" />

          <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px; background:var(--bg-main); padding:4px; border-radius:10px; border:1px solid var(--border-subtle);">
            <button type="button" onclick="setBuilderSlideMode(true)"
                    class="btn btn-sm ${customBuilderAllowSlide ? "btn-primary" : "btn-secondary"}"
                    style="width:100%;">
              Anywhere on Card
            </button>
            <button type="button" onclick="setBuilderSlideMode(false)"
                    class="btn btn-sm ${!customBuilderAllowSlide ? "btn-primary" : "btn-secondary"}"
                    style="width:100%;">
              Exact Spot Only
            </button>
          </div>

          <div style="max-width:230px; margin:0 auto; width:100%;">
            <div style="display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-bottom:6px; text-align:center; font-weight:900; font-size:0.85rem;">
              <span style="color:#60a5fa;">B</span>
              <span style="color:#f87171;">I</span>
              <span style="color:#4ade80;">N</span>
              <span style="color:#fbbf24;">G</span>
              <span style="color:#a78bfa;">O</span>
            </div>
            <div style="display:grid; grid-template-columns:repeat(5,1fr); gap:6px;">
              ${cellsHtml}
            </div>
          </div>

          <div style="text-align:center; font-size:0.8rem; color:var(--text-muted); line-height:1.4;">
            ${
              selectedArr.length === 0
                ? "Draw your shape above (e.g. a 2x2 square anywhere on the grid)"
                : `${selectedArr.length} squares • <strong>${masks.length}</strong> winning ${masks.length === 1 ? "spot" : "spots"} • Cols: <strong>${activeCols.join(", ")}</strong>`
            }
          </div>

          <div style="display:flex; gap:8px;">
            <button class="btn btn-secondary btn-sm" style="flex:1;" onclick="openCustomPatternBuilder()">Clear Grid</button>
            <button class="btn btn-primary btn-sm" style="flex:2;" onclick="saveCustomPattern()">Save & Use Pattern</button>
          </div>
        </div>
      `;
    }

    function saveCustomPattern() {
      const selectedArr = Array.from(customBuilderDraft).sort((a, b) => a - b);
      if (selectedArr.length === 0) {
        alert("Please tap at least 1 square on the grid first!");
        return;
      }

      const rawName = (document.getElementById("customPatNameInput")?.value || "").trim();
      const name = rawName || (customBuilderAllowSlide ? `Any ${selectedArr.length}-Sq Shape` : `Exact ${selectedArr.length}-Sq`);
      const masks = generateShiftedMasks(selectedArr, customBuilderAllowSlide);
      const activeCols = getActiveColsFromMasks(masks);
      const all25 = Array.from({ length: 25 }, (_, i) => i);
      const preview = all25.map((i) => (masks.at(0).includes(i) ? 1 : 0));

      const newPat = {
        id: "custom_" + Date.now(),
        name,
        desc:
          masks.length > 1
            ? `Any matching shape on card (${masks.length} positions)`
            : activeCols.length < 5
              ? `Exact spot (${activeCols.join(", ")} balls only)`
              : "Exact winning pattern",
        activeCols,
        preview,
        masks,
        isCustom: true
      };

      appState.customPatterns = [...(appState.customPatterns || []), newPat];
      selectPatternAndClose(newPat.id);
    }

    function closePatternModal() {
      clearModalAnimations();
      document.getElementById("patternModal").classList.remove("open");
    }
    /* ================= CALLER BOARD & SMART BALL FILTER ================= */
    function getEligibleNumbers() {
      const pat = getActivePattern();
      const allowedLetters = appState.patternOnlyCalls
        ? new Set(pat.activeCols)
        : new Set(["B", "I", "N", "G", "O"]);

      const eligible = [];
      LETTERS.forEach((grp) => {
        if (allowedLetters.has(grp.letter)) {
          for (let n = grp.min; n <= grp.max; n++) eligible.push(n);
        }
      });
      return eligible;
    }

    function renderMasterBoard() {
      const container = document.getElementById("masterBoardGrid");
      const calledSet = new Set(appState.calledNumbers);
      const latestNum = appState.calledNumbers.at(-1);
      const pat = getActivePattern();
      const allowedLetters = new Set(pat.activeCols);

      let html = "";
      LETTERS.forEach((grp) => {
        const isRowActive = !appState.patternOnlyCalls || allowedLetters.has(grp.letter);
        html += `<div class="board-row" style="${isRowActive ? "" : "opacity:0.28;"}">`;
        html += `<div class="board-letter-tag ball-${grp.letter}">${grp.letter}</div>`;
        for (let n = grp.min; n <= grp.max; n++) {
          const isCalled = calledSet.has(n);
          const isLatest = n === latestNum;
          const cls = isLatest ? "board-cell called latest" : isCalled ? "board-cell called" : "board-cell";
          html += `<div class="${cls}">${n}</div>`;
        }
        html += `</div>`;
      });
      container.innerHTML = html;

      const eligible = getEligibleNumbers();
      const eligibleSet = new Set(eligible);
      const calledEligibleCount = appState.calledNumbers.filter((n) => eligibleSet.has(n)).length;
      const remaining = Math.max(0, eligible.length - calledEligibleCount);

      document.getElementById("callStats").textContent =
        `${calledEligibleCount} of ${eligible.length} pattern balls called`;
      document.getElementById("remainingStats").textContent = `${remaining} Remaining`;
    }

    function renderCurrentAndRecentBalls() {
      const ballEl = document.getElementById("currentBall");
      const letterEl = document.getElementById("ballLetter");
      const numEl = document.getElementById("ballNumber");
      const recentEl = document.getElementById("recentBallsList");

      const called = appState.calledNumbers;
      if (called.length === 0) {
        ballEl.className = "current-ball";
        letterEl.textContent = "—";
        numEl.textContent = "READY";
        numEl.style.fontSize = "1.45rem";
        recentEl.innerHTML = `<span style="color:var(--text-muted); font-size:0.82rem;">No balls drawn yet</span>`;
        return;
      }

      const latest = called.at(-1);
      const letter = getLetterForNumber(latest);
      ballEl.className = `current-ball ball-${letter} pop`;
      void ballEl.offsetWidth;
      letterEl.textContent = letter;
      numEl.textContent = latest;
      numEl.style.fontSize = "2.6rem";

      const lastFive = called.slice(-6, -1).reverse();
      if (lastFive.length === 0) {
        recentEl.innerHTML = `<span style="color:var(--text-muted); font-size:0.82rem;">First ball drawn!</span>`;
      } else {
        recentEl.innerHTML = lastFive
          .map((n) => {
            const l = getLetterForNumber(n);
            return `<div class="mini-ball ball-${l}"><span>${l}</span><span>${n}</span></div>`;
          })
          .join("");
      }
    }

    function drawNextBall() {
      const calledSet = new Set(appState.calledNumbers);
      const pool = getEligibleNumbers().filter((n) => !calledSet.has(n));

      if (pool.length === 0) {
        stopAutoCall();
        alert("All eligible balls for this pattern have been called! Reset the game to start a new round.");
        return;
      }

      const nextNum = pool.at(Math.floor(Math.random() * pool.length));
      appState.calledNumbers.push(nextNum);
      saveState();

      const letter = getLetterForNumber(nextNum);
      renderCurrentAndRecentBalls();
      renderMasterBoard();
      playChime(false);
      speakCall(letter, nextNum);
    }

    function toggleAutoCall() {
      if (autoCallTimer) {
        stopAutoCall();
      } else {
        startAutoCall();
      }
    }

    function startAutoCall() {
      const calledSet = new Set(appState.calledNumbers);
      const pool = getEligibleNumbers().filter((n) => !calledSet.has(n));
      if (pool.length === 0) return;

      const secs = parseInt(document.getElementById("autoCallInterval").value, 10) || 8;
      const btn = document.getElementById("btnAutoCall");
      btn.textContent = "⏸ Pause Auto";
      btn.classList.remove("btn-secondary");
      btn.classList.add("btn-success");

      if (appState.calledNumbers.length === 0) drawNextBall();
      autoCallTimer = setInterval(() => {
        const remainingPool = getEligibleNumbers().filter(
          (n) => !new Set(appState.calledNumbers).has(n)
        );
        if (remainingPool.length === 0) {
          stopAutoCall();
        } else {
          drawNextBall();
        }
      }, secs * 1000);
    }

    function stopAutoCall() {
      if (autoCallTimer) {
        clearInterval(autoCallTimer);
        autoCallTimer = null;
      }
      const btn = document.getElementById("btnAutoCall");
      btn.textContent = "▶ Auto-Call";
      btn.classList.remove("btn-success");
      btn.classList.add("btn-secondary");
    }

    function updateAutoInterval() {
      if (autoCallTimer) {
        stopAutoCall();
        startAutoCall();
      }
    }

    function confirmNewGame() {
      if (appState.calledNumbers.length > 0) {
        if (!confirm("Start a brand-new round and clear all called numbers?")) return;
      }
      stopAutoCall();
      appState.calledNumbers = [];
      saveState();
      renderCurrentAndRecentBalls();
      renderMasterBoard();
    }
    /* ================= PLAYER CARDS & WIN CHECKER ================= */
    function generateSingleCard(cardIndex) {
      const columns = LETTERS.map((grp) => {
        const nums = [];
        for (let n = grp.min; n <= grp.max; n++) nums.push(n);
        for (let i = nums.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const tmp = nums.at(i);
          nums.splice(i, 1, nums.at(j));
          nums.splice(j, 1, tmp);
        }
        return nums.slice(0, 5);
      });

      const cells = [];
      for (let r = 0; r < 5; r++) {
        for (let c = 0; c < 5; c++) {
          const isFree = r === 2 && c === 2;
          cells.push({
            value: isFree ? "FREE" : columns.at(c).at(r),
            daubed: isFree,
            free: isFree
          });
        }
      }

      return {
        id: `CARD-${Date.now().toString().slice(-4)}-${cardIndex + 1}`,
        cells,
        hasWon: false
      };
    }

    function ensurePlayerCards() {
      while (appState.cards.length < appState.cardCount) {
        appState.cards.push(generateSingleCard(appState.cards.length));
      }
      if (appState.cards.length > appState.cardCount) {
        appState.cards = appState.cards.slice(0, appState.cardCount);
      }
    }

    function setCardCount(count) {
      appState.cardCount = count;
      ensurePlayerCards();
      saveState();
      updateCardCountButtons();
      renderPlayerCards();
    }

    function updateCardCountButtons() {
      for (let i = 1; i <= 4; i++) {
        const btn = document.getElementById(`cntBtn${i}`);
        if (!btn) continue;
        if (i === appState.cardCount) {
          btn.classList.remove("btn-secondary");
          btn.classList.add("btn-primary");
        } else {
          btn.classList.remove("btn-primary");
          btn.classList.add("btn-secondary");
        }
      }
    }

    function generateNewPlayerCards(askConfirm = false) {
      if (askConfirm && !confirm("Generate brand-new random player cards?")) return;
      appState.cards = [];
      for (let i = 0; i < appState.cardCount; i++) {
        appState.cards.push(generateSingleCard(i));
      }
      hideBingoBanner();
      saveState();
      renderPlayerCards();
    }

    function clearCardDaubs() {
      appState.cards.forEach((card) => {
        card.hasWon = false;
        card.cells.forEach((cell) => {
          cell.daubed = cell.free;
        });
      });
      hideBingoBanner();
      saveState();
      renderPlayerCards();
    }

    function evaluateCardWin(card) {
      const pat = getActivePattern();
      const winningIndices = new Set();
      let matched = false;

      pat.masks.forEach((mask) => {
        const isMaskComplete = mask.every((idx) => card.cells.at(idx)?.daubed);
        if (isMaskComplete) {
          matched = true;
          mask.forEach((idx) => winningIndices.add(idx));
        }
      });

      return { matched, winningIndices };
    }

    function toggleCellDaub(cardIdx, cellIdx) {
      const card = appState.cards.at(cardIdx);
      if (!card) return;
      const cell = card.cells.at(cellIdx);
      if (!cell || cell.free) return;

      cell.daubed = !cell.daubed;

      const result = evaluateCardWin(card);
      if (result.matched && !card.hasWon) {
        card.hasWon = true;
        playChime(true);
        showBingoBanner();
      } else if (!result.matched) {
        card.hasWon = false;
      }

      saveState();
      renderPlayerCards();
    }

    function renderPlayerCards() {
      ensurePlayerCards();
      updateCardCountButtons();

      const grid = document.getElementById("playerCardsGrid");
      grid.innerHTML = "";

      appState.cards.forEach((card, cardIdx) => {
        const { matched, winningIndices } = evaluateCardWin(card);
        card.hasWon = matched;

        const cardEl = document.createElement("div");
        cardEl.className = `bingo-card ${matched ? "winner" : ""}`;

        const topBar = document.createElement("div");
        topBar.className = "card-top-bar";
        topBar.innerHTML = `<span>${card.id}</span><span>${matched ? "🏆 BINGO!" : "Tap to Daub"}</span>`;
        cardEl.appendChild(topBar);

        const headersEl = document.createElement("div");
        headersEl.className = "card-headers";
        LETTERS.forEach((grp) => {
          const h = document.createElement("div");
          h.className = `card-col-head ball-${grp.letter}`;
          h.textContent = grp.letter;
          headersEl.appendChild(h);
        });
        cardEl.appendChild(headersEl);

        const cellsEl = document.createElement("div");
        cellsEl.className = "card-cells";

        card.cells.forEach((cell, cellIdx) => {
          const cellBtn = document.createElement("div");
          const isWinCell = winningIndices.has(cellIdx);
          cellBtn.className = [
            "card-cell",
            cell.daubed ? "daubed" : "",
            cell.free ? "free-space" : "",
            isWinCell ? "win-highlight" : ""
          ]
            .filter(Boolean)
            .join(" ");

          cellBtn.textContent = cell.value;
          cellBtn.onclick = () => toggleCellDaub(cardIdx, cellIdx);
          cellsEl.appendChild(cellBtn);
        });

        cardEl.appendChild(cellsEl);
        grid.appendChild(cardEl);
      });
    }

    function showBingoBanner() {
      document.getElementById("bingoBanner").classList.add("show");
    }

    function hideBingoBanner() {
      document.getElementById("bingoBanner").classList.remove("show");
    }

    /* ================= NAVIGATION & INITIALIZATION ================= */
    function switchMode(mode) {
      appState.mode = mode;
      saveState();

      document.getElementById("tabCaller").classList.toggle("active", mode === "caller");
      document.getElementById("tabPlayer").classList.toggle("active", mode === "player");
      document.getElementById("viewCaller").classList.toggle("active", mode === "caller");
      document.getElementById("viewPlayer").classList.toggle("active", mode === "player");

      if (mode === "player") {
        renderPlayerCards();
      } else {
        renderCurrentAndRecentBalls();
        renderMasterBoard();
      }
    }

    function toggleSound() {
      appState.soundEnabled = !appState.soundEnabled;
      saveState();
      updateSoundButton();
    }

    function updateSoundButton() {
      const btn = document.getElementById("btnSound");
      const icon = document.getElementById("soundIcon");
      const label = document.getElementById("soundLabel");
      if (appState.soundEnabled) {
        btn.classList.remove("muted");
        icon.textContent = "🔊";
        label.textContent = "Voice On";
      } else {
        btn.classList.add("muted");
        icon.textContent = "🔇";
        label.textContent = "Muted";
        if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      }
    }

    function initApp() {
      loadState();
      updateSoundButton();
      renderPatternBar();
      renderCurrentAndRecentBalls();
      renderMasterBoard();
      renderPlayerCards();
      switchMode(appState.mode || "caller");
    }

    window.addEventListener("DOMContentLoaded", initApp);
  </script>
</body>
</html>
